name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - "enhancement"
      - "feature"
  - title: "🛡️ Security"
    labels:
      - "security"
      - "security fix"
  - title: "🐛 Bug fixes"
    labels:
      - "bug"
  - title: "📚 Documentation"
    labels:
      - "documentation"
  - title: "🧰 Maintenance"
    labels:
      - "dependencies"
      - "maintenance"
      - "ci"
exclude-labels:
  - "skip-changelog"
  - "duplicate"
  - "invalid"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## What's changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
