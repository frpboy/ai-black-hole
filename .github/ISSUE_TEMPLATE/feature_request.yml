name: Feature request
description: Propose a focused capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What concrete user or maintainer problem exists today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and resource impact
      description: Consider false positives, data exposure, isolation, CPU/memory/time bounds, and rollback.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Project principles
      options:
        - label: This does not require a hosted SaaS or mandatory external telemetry.
          required: true
        - label: This does not rely on identifying a visitor as an AI agent with certainty.
          required: true
        - label: This does not introduce destructive, unbounded, or retaliatory behaviour.
          required: true
