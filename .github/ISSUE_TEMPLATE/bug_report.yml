name: Bug report
description: Report a reproducible defect in AI Black Hole.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please search existing issues first. Never include credentials, real user data, production secrets, or exploit details."
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version, commit SHA, or release tag.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Runtime, OS, framework adapter, and relevant versions.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
      description: Redact tokens, cookies, IP addresses, personal data, and request bodies.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and personal/production data.
          required: true
