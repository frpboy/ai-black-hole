name: First interaction

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue in AI Black Hole.

            A maintainer will review it. Please keep reports reproducible, focused, and free of secrets or real user data. Security vulnerabilities must be reported privately; see SECURITY.md.
          pr-message: |
            Thanks for your first contribution to AI Black Hole.

            A maintainer will review the change. Please make sure the tests, documentation, and security checklist are complete. We appreciate the effort!
